<!doctype html>
<html lang="pt-BR" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CRM by HumanoidOS</title>
    
    <!-- Cache Control Meta Tags - Force fresh content on reload -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <script>
      // Previne flash de tema errado durante carregamento
      try {
        const theme = localStorage.getItem('legal-crm-theme');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else if (theme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          // Se for 'system' ou não tiver preferência, detecta do sistema
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          }
        }
      } catch (e) {}
    </script>
    <meta name="description" content="CRM Inteligente com automação total, integrado a agentes de enrichment, scoring e SDR. Elimine o trabalho manual do seu time de vendas agora.">
    <meta name="author" content="LEGAL" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
