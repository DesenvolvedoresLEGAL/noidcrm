    <script>
      // Previne flash de tema errado durante carregamento
      try {
        const theme = localStorage.getItem('legal-crm-theme');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else if (theme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          // Se for 'system' ou não tiver preferência, detecta do sistema
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          }
        }
      } catch (e) {}
    </script>
