name: Production Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: vite build (production)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run production build
        id: build
        run: |
          set -o pipefail
          mkdir -p build-logs
          npm run build 2>&1 | tee build-logs/build.log
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Publish build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-build-logs
          path: build-logs/
          retention-days: 14
          if-no-files-found: warn

      - name: Print full build log (on failure)
        if: failure()
        run: |
          echo "::group::Full production build log"
          cat build-logs/build.log || echo "No log file produced."
          echo "::endgroup::"

      - name: Annotate failure
        if: failure()
        run: |
          echo "::error title=Production build failed::vite build exited with a non-zero status. See uploaded artifact 'production-build-logs' for the full log."
